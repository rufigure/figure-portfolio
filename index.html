<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>figure.ru — Поиск истины в цифровом мире</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/images/upload-3e75bb.jpg" type="image/jpeg">
</head>
<body>
    <div class="scroll-progress"></div>
    
    <header class="header">
        <nav class="nav">
            <a href="#" class="logo">figure.ru</a>
            <div class="nav-menu">
                <a href="#home">Главная</a>
                <a href="#cases">Мои кейсы</a>
            </div>
            <button class="nav-toggle" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <div class="hero-avatar-wrapper">
                    <div class="avatar-glow"></div>
                    <img src="assets/images/upload-3e75bb.jpg" alt="Аватар" class="hero-avatar">
                </div>
                <h1 class="hero-title">Находим и учимся</h1>
                <p class="hero-domain">figure.ru</p>
                <p class="hero-subtitle">Поиск истины в цифровом мире. Учусь и мыслю</p>
            </div>
            <div class="scroll-indicator">
                <span>Листайте вниз</span>
                <div class="scroll-arrow"></div>
            </div>
        </section>

        <section id="cases" class="cases-section">
            <div class="container">
                <div class="cases-content reveal">
                    <h2 class="section-title">Мои кейсы</h2>
                    <div class="cases-empty">
                        <div class="empty-icon"></div>
                        <p class="empty-text">Пока что кейсов нету, но это только начало!</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="thanks-section">
            <div class="container">
                <div class="thanks-content reveal">
                    <h2 class="section-title">Спасибо за внимание</h2>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <span class="footer-logo">figure.ru</span>
                <p class="footer-text">© 2026 Все права защищены</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
